limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/m;
map $http_x_request_id $correlation_id {
    default $http_x_request_id;
    "" $request_id;
}

upstream user_service { server user-service:8000; }
upstream product_service { server product-service:8000; }
upstream cart_service { server cart-service:8000; }
upstream order_service { server order-service:8000; }
upstream payment_service { server payment-service:8000; }

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Request-ID $correlation_id always;

    location = /gateway/health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy","service":"api-gateway"}';
    }

    # This endpoint proves the complete browser -> gateway -> FastAPI -> PostgreSQL path.
    location = /api/system/ready {
        proxy_pass http://user_service/ready;
        include /etc/nginx/proxy-common.conf;
    }

    location = /api/system/health {
        proxy_pass http://user_service/health;
        include /etc/nginx/proxy-common.conf;
    }

    location ~ ^/api/auth(/.*)?$ {
        limit_req zone=auth_limit burst=10 nodelay;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://user_service;
        include /etc/nginx/proxy-common.conf;
    }

    location ~ ^/api/users(/.*)?$ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://user_service;
        include /etc/nginx/proxy-common.conf;
    }

    location ~ ^/api/(products|categories)(/.*)?$ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://product_service;
        include /etc/nginx/proxy-common.conf;
    }

    location ~ ^/api/cart(/.*)?$ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://cart_service;
        include /etc/nginx/proxy-common.conf;
    }

    location ~ ^/api/orders(/.*)?$ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://order_service;
        include /etc/nginx/proxy-common.conf;
    }

    location ~ ^/api/payments(/.*)?$ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://payment_service;
        include /etc/nginx/proxy-common.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
