[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "commerce-cart-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "scalecart-common",
  "redis>=5.2,<6.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1.0", "pytest>=8.3,<9.0", "pytest-asyncio>=0.25,<1.0"]

[tool.setuptools.packages.find]
include = ["app*"]
